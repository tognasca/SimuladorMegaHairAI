<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Tati Mega Hair · Modo Salão</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #211613; color: #fff3e8; font: 1.25rem Georgia, serif; text-align: center; }
        main { min-height: 100vh; padding: 3vh 4vw; }
        h1 { margin: 0 0 2vh; font-size: 5vh; }
        #status { margin: 1vh 0; font-size: 3vh; }
        #codigo { font: bold 12vh system-ui, sans-serif; letter-spacing: .16em; margin: 12vh 0 0; }
        #fotos { display: flex; justify-content: center; gap: 2vw; margin: 2vh 0 0; }
        figure { margin: 0; min-width: 0; max-width: 47%; }
        figure[hidden], #fotos[hidden] { display: none; }
        img { display: block; max-width: 100%; height: 65vh; width: auto; object-fit: contain; border-radius: 12px; }
        figcaption { margin-top: 1vh; }
        #orcamento { margin: 1vh 0; font-size: 3vh; }
    </style>
</head>
<body>
<main>
    <h1>Tati Mega Hair</h1>
    <p id="status" role="status">Preparando o pareamento…</p>
    <p id="codigo" hidden></p>
    <div id="fotos" hidden>
        <figure id="original" hidden><img id="antes" alt="Foto original"><figcaption>Antes</figcaption></figure>
        <figure id="simulacao" hidden><img id="depois" alt="Resultado da simulação"><figcaption>Depois</figcaption></figure>
    </div>
    <p id="orcamento" hidden></p>
</main>
<script src="/js/salao-tv.js"></script>
</body>
</html>
