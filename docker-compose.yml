services:
  postgres:
    image: postgres:16-alpine
    container_name: megahair-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-simulacaomegahairdb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - megahair-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: megahair-api
    restart: unless-stopped
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-simulacaomegahairdb};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      Jwt__Key: ${JWT_KEY:?Defina JWT_KEY no arquivo .env}
      Jwt__Issuer: ${JWT_ISSUER:-SimuladorMegaHair}
      Jwt__Audience: ${JWT_AUDIENCE:-SimuladorMegaHair.Clients}
      Replicate__ApiToken: ${REPLICATE_API_TOKEN:?Defina REPLICATE_API_TOKEN no arquivo .env}
      OpenAI__ApiToken: ${OpenAI__ApiToken:-}
      OpenAI__Model: ${OpenAI__Model:-gpt-image-1}
      OpenAI__Size: ${OpenAI__Size:-1024x1024}
      OpenAI__Quality: ${OpenAI__Quality:-high}
      Pipeline__Metodo: ${MEGAHAIR_METODO:-openai}
      PublicBaseUrl: ${PUBLIC_API_URL:-https://api-simulador.tatimegahair.com.br}
      AllowedOrigins__0: http://localhost:5180
      AllowedOrigins__1: http://localhost:7180
      AllowedOrigins__2: https://simulador.tatimegahair.com.br
      AllowedOrigins__3: https://www.simulador.tatimegahair.com.br
    volumes:
      - megahair-uploads:/app/wwwroot/uploads
      - megahair-resultados:/app/wwwroot/resultados
    ports:
      - "5185:5185"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: megahair-web
    restart: unless-stopped
    environment:
      Api__BaseUrl: http://api:5185/
    volumes:
      - megahair-web-keys:/root/.aspnet/DataProtection-Keys
    ports:
      - "5180:5180"
    depends_on:
      - api

volumes:
  megahair-postgres-data:
  megahair-web-keys:
  megahair-uploads:
  megahair-resultados:
