name: Cadastro de saloes

on:
  push:
    branches: [feat/isolamento-por-salao]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: teste-ci
          POSTGRES_DB: saloes_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d saloes_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=saloes_ci;Username=postgres;Password=teste-ci
      Jwt__Key: chave-exclusiva-para-teste-de-integracao-com-mais-de-32-caracteres
      OpenAI__ApiToken: ""
      Pipeline__Metodo: openai
      PGPASSWORD: teste-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Testes
        run: dotnet test SimuladorMegaHair.Tests/SimuladorMegaHair.Tests.csproj -c Release
      - name: Compilar API
        run: dotnet build SimuladorMegaHair.Api/SimuladorMegaHair.Api.csproj -c Release
      - name: Iniciar API
        working-directory: SimuladorMegaHair.Api
        run: |
          dotnet bin/Release/net8.0/SimuladorMegaHair.Api.dll --urls http://127.0.0.1:5185 > /tmp/saloes-api.log 2>&1 &
          for tentativa in $(seq 1 40); do
            if curl -s -o /dev/null http://127.0.0.1:5185/api/orcamento/opcoes; then exit 0; fi
            sleep 1
          done
          cat /tmp/saloes-api.log
          exit 1
      - name: Cadastro, autorizacao e concorrencia
        run: python3 scripts/testar-cadastro-saloes.py
      - name: Bloquear central na instancia de outro salao
        working-directory: SimuladorMegaHair.Api
        env:
          CadastroSalao__ChaveInicial: chave-exclusiva-da-instancia-de-teste
        run: |
          dotnet bin/Release/net8.0/SimuladorMegaHair.Api.dll --urls http://127.0.0.1:5186 > /tmp/salao-secundario.log 2>&1 &
          for tentativa in $(seq 1 40); do
            if curl -s -o /dev/null http://127.0.0.1:5186/api/orcamento/opcoes; then
              python3 ../scripts/testar-central-restrita.py
              exit $?
            fi
            sleep 1
          done
          cat /tmp/salao-secundario.log
          exit 1
      - name: Iniciar Web
        working-directory: SimuladorMegaHair.Web
        env:
          Api__BaseUrl: http://127.0.0.1:5185/
        run: |
          dotnet bin/Release/net8.0/SimuladorMegaHair.Web.dll --urls http://127.0.0.1:5180 > /tmp/saloes-web.log 2>&1 &
          for tentativa in $(seq 1 40); do
            if curl -s -o /dev/null http://127.0.0.1:5180/admin/saloes; then exit 0; fi
            sleep 1
          done
          cat /tmp/saloes-web.log
          exit 1
      - name: Validar renovação de mídia e proxy
        run: |
          python3 -m venv "$RUNNER_TEMP/megahair-media"
          "$RUNNER_TEMP/megahair-media/bin/pip" install Pillow
          "$RUNNER_TEMP/megahair-media/bin/python" scripts/testar-renovacao-midia.py
      - name: Testar tela em celular, tablet e desktop
        run: |
          npm install --prefix "$RUNNER_TEMP/saloes-browser" playwright
          "$RUNNER_TEMP/saloes-browser/node_modules/.bin/playwright" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/saloes-browser/node_modules" node scripts/testar-tela-saloes.cjs
      - name: Logs da API
        if: failure()
        run: cat /tmp/saloes-api.log || true
